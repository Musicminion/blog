# ---------- GitLab Pages 部署阶段 ----------
create-pages:
  stage: pages
  image: node:lts
  before_script:
    |
      export TZ=Asia/Shanghai
      sed -i "s|^url:.*|url: https://pages.ayaka.space/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}|" _config.yml
      npm install
  script:
    - echo "当前时间：$(date '+%Y-%m-%d %H:%M:%S')"
    - npm run build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
